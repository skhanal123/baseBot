# Local development services for baseBot (US-18)
#
# Default (Postgres + Redis — pgvector telecom demo):
#   docker compose up -d
#   pnpm demo:setup
#
# Mongo durable store (Redis + optional Mongo; set DURABLE_STORE=mongo in .env):
#   docker compose --profile mongo up -d
#   DURABLE_STORE=mongo pnpm demo:setup

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: basebot
      POSTGRES_PASSWORD: basebot
      POSTGRES_DB: basebot
    ports:
      # 5434 avoids conflict with local PostgreSQL on 5432/5433 (common on Windows/macOS)
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U basebot"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  mongo:
    profiles: [mongo]
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  mongo_data:
