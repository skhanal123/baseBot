# Local development services for baseBot Phase 0+
# Usage: docker compose up -d

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: basebot
      POSTGRES_PASSWORD: basebot
      POSTGRES_DB: basebot
    ports:
      # 5434 avoids conflict with local PostgreSQL on 5432/5433 (common on Windows/macOS)
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U basebot"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
