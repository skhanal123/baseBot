  /health:
    get:
      summary: Liveness probe
      tags:
        - Health
      responses:
        "200":
          description: Service is alive
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                      - ok
                required:
                  - status
  /health/ready:
    get:
      summary: Readiness probe (Redis, durable store, workers)
      tags:
        - Health
      responses:
        "200":
          description: Dependencies healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                      - ok
                  redis:
                    type: boolean
                  database:
                    type: boolean
                  worker:
                    type: boolean
                required:
                  - status
                  - redis
                  - database
                  - worker
        "503":
          description: One or more dependencies unavailable
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                      - degraded
                  redis:
                    type: boolean
                  database:
                    type: boolean
                  worker:
                    type: boolean
                required:
                  - status
                  - redis
                  - database
                  - worker
