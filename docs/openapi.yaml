                required:
                  - code
                  - message
        "409":
          description: Thread limit exceeded
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    enum: *a1
                  message:
                    type: string
                  correlation_id:
                    type: string
                required:
                  - code
                  - message
        "422":
          description: Hook rejected
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    enum: *a1
                  message:
                    type: string
                  correlation_id:
                    type: string
                required:
                  - code
                  - message
        "500":
          description: Internal error
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    enum: *a1
                  message:
                    type: string
                  correlation_id:
                    type: string
                required:
                  - code
                  - message
  /v1/stream/{job_id}:
    get:
      summary: SSE stream for async job
      tags:
        - Stream
      parameters:
        - schema:
            type: string
          required: true
          name: job_id
          in: path
        - schema:
            type: string
            description: Signed stream token from 202 response
          required: true
          description: Signed stream token from 202 response
          name: token
          in: query
      responses:
        "200":
          description: Server-sent events stream
          content:
            text/event-stream:
              schema:
                type: string
                description: "SSE events: message.start, message.delta, message.end, error"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    enum: *a1
                  message:
                    type: string
                  correlation_id:
                    type: string
                required:
                  - code
                  - message
        "401":
          description: Stream token invalid or expired
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    enum: *a1
                  message:
                    type: string
                  correlation_id:
